<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Home | Canecarty </title>

<!-- aqui são os scripts do javascript que vão deixar o site mais dinâmico -->
    <script src="/js/mobile-navbar.js" defer ></script> <!-- o defer é para ele carregar depois do site pronto -->
    <script src="/js/index.js" defer ></script>

    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/index.css">
</head>

<!-- aqui começa o corpo, onde vai ficar todo o site  -->
    <body>

        <!-- aqui onde fica a navegação, ou seja o menu para o usuário-->
        <header>
            <nav>
                <ul class="nav-list">
                    <li><a href="/html/colecao.html"> Coleção </a></li>
                    <li><a href="#"> Sobre </a></li>
                    <li><a href="#"> Feedback </a></li>
                </ul>

                <div class="mobile-menu">
                    <div class="line1"></div>
                    <div class="line2"></div>
                    <div class="line3"></div>
                </div>

                
                <div class="logo">
                    <a href="/html/index.html"> CANECARTY </a>
                </div>


                <div>
                    <nav>

                        <div class="img-navbar">

                            <div> <!-- div para botao do usuario-->
                                <button class="btn-user">
                                    <img src="/assets/user.png" alt="usuario" class="img-user"> <!-- 👤 -->
                                </button>

                                <!-- tela popup modal para criação de conta/acesso a conta do usuario -->
                                <dialog>
                                    <h2> Crie sua conta </h2>

                                    <form method="dialogForm">
                                        <input type="email" placeholder="Digite seu email" required>
                                        <input type="password" placeholder="Digite sua senha" required>
                                        <button type="submit"> Criar conta </button>
                                        <a href="#">esqueceu sua senha? </a>
                                    </form>

                                    <button class="btn-closeForm"> fechar </button>
                                </dialog>
                            </div>


                            <div> <!-- div para o botao do carrinho de compras -->
                                <button class="btn-cart">
                                    <img src="/assets/carrinho.png" alt="carrinho" class="img-cart">
                                </button>


                                <!-- tela popup modal para o carrinho de compras -->
                                <dialog class="dialogCart">
                                    <h2> Carrinho de Compras </h2>

                                    <form method="dialogCart">
                                        <p> Seu carrinho está vazio. </p>
                                        <button type="submit"> Continuar comprando </button>
                                    </form>

                                    <button class="btn-goCart"> ir para carrinho </button>
                                </dialog>
                            </div>
                            
                        </div>
                    </nav>
                </div>
                    

            </nav>
        <!-- fim da navegação do menu do site-->
        </header>


        <!-- aqui já é a home que vai ficar as imagens com informações principais. mantendo sempre clean. -->
        <main>
            <section class="container">

                <section class="slider">
                    <div class="slider-content">

                        <input type="radio" name="btn-radio" id="radio1">
                        <input type="radio" name="btn-radio" id="radio2">
                        <input type="radio" name="btn-radio" id="radio3">
                        <input type="radio" name="btn-radio" id="radio4">

                        <!-- imagens dos sliders-->
                        <div class="slide-box first">
                            <img class="img-desktop" src="/images/slide-1.jpg" alt="slide 1">
                            <img class="img-mobile" src="/images/slide-1-mob.jpg" alt="slide 1">
                        </div>

                        <div class="slide-box">
                            <img class="img-desktop" src="/images/slide-2.jpg" alt="slide 2">
                            <img class="img-mobile" src="/images/slide-2-mob.jpg" alt="slide 2">
                        </div>

                        <div class="slide-box">
                            <img class="img-desktop" src="/images/slide-3.jpg" alt="slide 3">
                            <img class="img-mobile" src="/images/slide-3-mob.jpg" alt="slide 3">
                        </div>

                        <!-- navegação automatica dos radios buttons -->
                        <div class="nav-auto">
                            <div class="auto-btn1"></div>
                            <div class="auto-btn2"></div>
                            <div class="auto-btn3"></div>
                        </div>

                        <!-- navegação clicavel dos radios buttons -->
                        <div class="nav-manual">
                            <label for="radio1" class="manual-btn"></label>
                            <label for="radio2" class="manual-btn"></label>
                            <label for="radio3" class="manual-btn"></label>
                        </div>

                    </div>
                </section>

            </section>
        </main>


        <!-- esse é o rodapé, vai ser bem simples sem muitos dados, mas para deixar organizado -->
        <footer>
            <p> &copy; 2025 Canecarty. Todos os direitos reservados. </p>
            <p> Desenvolvido por <a href="https://www.instagram.com/imtouchs/" target="_blank"> @imtouchs </a> </p>
        </footer> 

    </body>
</html>
